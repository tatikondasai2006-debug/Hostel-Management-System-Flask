{% extends "base.html" %}
{% block title %}400 — Bad request{% endblock %}
{% block body %}
<div class="auth-wrapper">
  <main class="auth-panel mx-auto">
    <div class="error-page text-center">
      <div class="error-code">400</div>
      <h4>Bad request</h4>
      <p class="text-muted">{{ message or 'The request could not be understood. Please check the form and try again.' }}</p>
      <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
    </div>
  </main>
</div>
{% endblock %}
