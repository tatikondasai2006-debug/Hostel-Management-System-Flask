# Ruff configuration for the Hostel Management System.
# Run: python -m ruff check . && python -m ruff format .
target-version = "py312"
line-length = 100

# Alembic migrations are autogenerated; local/virtualenv dirs are not source.
extend-exclude = ["migrations", ".venv", "instance"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[lint.isort]
known-first-party = ["app", "config"]

[lint.per-file-ignores]
# Tests may use broad asserts and fixtures without type annotations.
"tests/**" = ["B011"]

[format]
quote-style = "double"
indent-style = "space"
